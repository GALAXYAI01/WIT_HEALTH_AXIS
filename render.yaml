services:
  - type: web
    name: wit-health-axis
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: WIT_COOKIE_SECURE
        value: "true"
      - key: WIT_COOKIE_SAMESITE
        value: lax
      - key: WIT_ENABLE_HSTS
        value: "true"
      - key: WIT_REQUIRE_AUTH
        value: "false"
      - key: WIT_ALLOWED_ORIGINS
        value: ""
      - key: WIT_HISTORY_DB_PATH
        value: /tmp/wit-scan-history.db
      - key: WIT_TORCH_THREADS
        value: "1"
      - key: WIT_ENABLE_GRADCAM
        value: "false"
      - key: WIT_INFERENCE_BACKEND
        value: onnx
      - key: WIT_RELEASE
        value: 20260806-inference-fix-v1
      - key: WIT_JWT_SECRET
        generateValue: true
      - key: WIT_FIELD_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
